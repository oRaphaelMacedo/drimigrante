# Deploy MANUAL das Edge Functions de produção (DI-015).
#
# - Só roda por workflow_dispatch (Actions → "Deploy das Edge Functions" →
#   Run workflow) e só a partir da main ou de uma tag vAAAA.MM.DD.
# - O job "deploy" usa o environment "production": o GitHub pede aprovação de
#   um revisor antes de liberar o SUPABASE_ACCESS_TOKEN (secret do environment,
#   não do repositório). Configuração: docs/operacao/release.md, seção 7.
# - Lista EXPLÍCITA de functions de produção (a mesma de docs/testes.md). A
#   e2e-login nunca entra. Function nova só entra depois de ir para aquela lista
#   e para PROD_FUNCTIONS abaixo.
# - verify_jwt vem do supabase/config.toml: quem tem `verify_jwt = false` lá
#   recebe --no-verify-jwt (stripe-webhook, create-checkout-session, claim-session).
# - Não aplica migration. A ordem migration ↔ function de cada release está em
#   docs/operacao/release.md (ex.: chat-completion nova ANTES da 20261016000300).
# - dry_run (padrão) só valida a lista, roda os testes Deno e mostra o plano.
name: Deploy das Edge Functions

on:
  workflow_dispatch:
    inputs:
      functions:
        description: 'Functions separadas por vírgula (ex.: chat-completion,send-email) ou "todas"'
        required: true
        type: string
      dry_run:
        description: 'Só validar e mostrar o plano (desmarque para publicar)'
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: deploy-functions-production
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_REF: krjirhlmdnxqqrpzmowz
  # Ordem de deploy quando várias são pedidas juntas. e2e-login fica de fora.
  PROD_FUNCTIONS: >-
    compute-eligibility
    send-email
    chat-completion
    generate-explanation
    create-checkout-session
    claim-session
    stripe-webhook

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      functions: ${{ steps.plan.outputs.functions }}
    steps:
      - name: Conferir a ref (main ou tag v*)
        env:
          REF: ${{ github.ref }}
        run: |
          case "$REF" in
            refs/heads/main|refs/tags/v*) echo "Ref: $REF" ;;
            *) echo "::error::Deploy só a partir da main ou de uma tag v* (recebido: $REF)"; exit 1 ;;
          esac

      - uses: actions/checkout@v4

      - name: Montar o plano
        id: plan
        env:
          FUNCTIONS_INPUT: ${{ inputs.functions }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          set -f # sem expansão de curingas na entrada
          requested=$(printf '%s' "$FUNCTIONS_INPUT" | tr ',' ' ' | tr -s ' ' | tr '[:upper:]' '[:lower:]')
          if [ -z "${requested// /}" ]; then
            echo "::error::Informe ao menos uma function (ou \"todas\")."; exit 1
          fi

          for fn in $requested; do
            if [ "$fn" = "e2e-login" ]; then
              echo "::error::e2e-login nunca vai para produção (docs/testes.md)."; exit 1
            fi
            if [ "$fn" != "todas" ] && ! printf ' %s ' $PROD_FUNCTIONS | grep -qF -- " $fn "; then
              echo "::error::\"$fn\" não está na lista de functions de produção: $PROD_FUNCTIONS"; exit 1
            fi
          done

          selected=""
          for fn in $PROD_FUNCTIONS; do
            if printf ' %s ' $requested | grep -qF -e " todas " -e " $fn "; then
              if [ ! -f "supabase/functions/$fn/index.ts" ]; then
                echo "::error::supabase/functions/$fn/index.ts não existe nesta ref."; exit 1
              fi
              selected="$selected $fn"
            fi
          done
          selected="${selected# }"

          # verify_jwt de cada function, lido do config.toml (padrão: true).
          {
            echo "## Plano de deploy"
            echo ""
            echo "- Projeto: \`$SUPABASE_PROJECT_REF\`"
            echo "- Ref: \`${GITHUB_REF}\` (\`${GITHUB_SHA::7}\`)"
            echo "- Modo: $([ "$DRY_RUN" = 'true' ] && echo 'simulação (nada é publicado)' || echo 'publicação, depois da aprovação')"
            echo ""
            echo "| # | Function | verify_jwt |"
            echo "|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          i=0
          for fn in $selected; do
            i=$((i + 1))
            verify=$(awk -v sec="[functions.$fn]" '
              $0 == sec { inside = 1; next }
              /^\[/ { inside = 0 }
              inside && $1 == "verify_jwt" { print $3; exit }
            ' supabase/config.toml)
            echo "| $i | \`$fn\` | ${verify:-true} |" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Antes de publicar, confira a ordem migration ↔ function em docs/operacao/release.md." >> "$GITHUB_STEP_SUMMARY"

          echo "Plano: $selected"
          echo "functions=$selected" >> "$GITHUB_OUTPUT"

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # Mesmos testes do job "functions" do CI: handlers puros, sem rede nem chaves.
      - name: Testes das Edge Functions (Deno)
        run: deno test --no-config supabase/functions

  deploy:
    name: deploy
    needs: plan
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://supabase.com/dashboard/project/krjirhlmdnxqqrpzmowz/functions
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.98.2

      - name: Publicar
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          FUNCTIONS: ${{ needs.plan.outputs.functions }}
        run: |
          set -euo pipefail
          set -f
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::Secret SUPABASE_ACCESS_TOKEN ausente no environment production."; exit 1
          fi
          for fn in $FUNCTIONS; do
            verify=$(awk -v sec="[functions.$fn]" '
              $0 == sec { inside = 1; next }
              /^\[/ { inside = 0 }
              inside && $1 == "verify_jwt" { print $3; exit }
            ' supabase/config.toml)
            flags=""
            if [ "$verify" = "false" ]; then flags="--no-verify-jwt"; fi
            echo "::group::$fn ${flags}"
            # Sempre pelo nome: nunca deploy sem nome nem --prune.
            supabase functions deploy "$fn" --project-ref "$SUPABASE_PROJECT_REF" $flags
            echo "::endgroup::"
          done

      - name: Versões publicadas
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions list --project-ref "$SUPABASE_PROJECT_REF"
