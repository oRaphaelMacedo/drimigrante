    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1f41c7" />
    <meta name="color-scheme" content="only light" />

    <!-- Ícones (gerados por scripts/generate-icons.mjs) -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <meta name="application-name" content="Dr Imigrante" />

    <!-- API (Supabase): adianta DNS + TLS da primeira chamada -->
    <link rel="preconnect" href="https://krjirhlmdnxqqrpzmowz.supabase.co" crossorigin />

    <!-- Title, description e og:image iguais aos padrões de src/hooks/useSEO.ts -->

    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Doutor Imigrante — Descubra se você tem direito à nacionalidade portuguesa. Diagnóstico gratuito." />
